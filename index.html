  function reset(){
    levelIndex = 0;
    lives = 3;
    totalRunTime = 0;
    startLevel();
  }

  function hurt(){
    if(player.invuln>0 || runState!=='playing') return;
    lives--;
    beep(150,0.3,'sawtooth',0.08);
    if(lives<=0){
      runState='over';
      submitResult('platform', 'loss', null, { level: levelIndex+1, coins: coinsCollected });
      setTimeout(()=> showBigMessage('GAME OVER', 'Collected '+coinsCollected+'/'+totalCoins+' coins.', '#ff3d6e', 'TRY AGAIN', ()=>{ hideBigMessage(); reset(); }), 300);
    } else {
      player.x=respawnPoint.x; player.y=respawnPoint.y; player.vx=0; player.vy=0; player.invuln=INVULN;
    }
  }

  function win(){
    if(runState!=='playing') return;
    runState='won';
    const mm=Math.floor(gameTime/60), ss=(gameTime%60).toFixed(1);
    const timeStr = mm+':'+(ss.length<3?'0'+ss:ss);
    beep(523,0.1,'square',0.08,0); beep(659,0.1,'square',0.08,0.1); beep(784,0.1,'square',0.08,0.2); beep(1046,0.2,'square',0.09,0.3);
    const isLast = levelIndex >= LEVELS.length-1;
    if(isLast){
      const totalMm=Math.floor(totalRunTime/60), totalSs=(totalRunTime%60).toFixed(1);
      const totalTimeStr = totalMm+':'+(totalSs.length<3?'0'+totalSs:totalSs);
      submitResult('platform', 'cleared', totalRunTime, { coins: coinsCollected });
      setTimeout(()=> showBigMessage('ARCADE COMPLETE', 'All '+LEVELS.length+' levels cleared · Time '+totalTimeStr+' · '+coinsCollected+'/'+totalCoins+' coins', '#b968f0', 'PLAY AGAIN', ()=>{ hideBigMessage(); reset(); }), 300);
    } else {
      setTimeout(()=> showBigMessage('LEVEL '+(levelIndex+1)+' CLEAR', 'Time '+timeStr+' · '+coinsCollected+'/'+totalCoins+' coins', '#b968f0', 'NEXT LEVEL', ()=>{ hideBigMessage(); levelIndex++; startLevel(); }), 300);
    }
  }

  function resolveX(){
    for(const p of platforms){
      if(aabbOverlap(player,p)){
        if(player.vx>0) player.x = p.x - player.w;
        else if(player.vx<0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }
  function resolveY(){
    player.onGround = false;
    for(const p of platforms){
      if(aabbOverlap(player,p)){
        if(player.vy>0){ player.y = p.y - player.h; player.vy=0; player.onGround=true; }
        else if(player.vy<0){ player.y = p.y + p.h; player.vy=0; }
      }
    }
  }

  function update(dt){
    if(runState==='countdown'){
      countdown -= dt;
      if(countdown<=0) runState='playing';
      return;
    }
    if(runState!=='playing') return;
    gameTime += dt;
    totalRunTime += dt;
    if(player.invuln>0) player.invuln -= dt;

    let moveInput = 0;
    if(keys['ArrowLeft']||keys['a']) moveInput -= 1;
    if(keys['ArrowRight']||keys['d']) moveInput += 1;
    if(moveInput!==0){
      player.vx = clamp(player.vx + moveInput*MOVE_ACCEL*dt, -MOVE_MAX, MOVE_MAX);
      player.facing = moveInput;
    } else {
      const fr = (player.onGround?GROUND_FRICTION:AIR_FRICTION)*dt;
      if(player.vx>0) player.vx = Math.max(0, player.vx-fr);
      else if(player.vx<0) player.vx = Math.min(0, player.vx+fr);
    }

    const jumpPressed = keys['ArrowUp']||keys['w']||keys[' ']||keys['Spacebar'];
    if(jumpPressed && !player.jumpHeld && (player.onGround || player.coyote>0)){
      player.vy = JUMP_VEL;
      player.onGround = false; player.coyote = 0;
      beep(520,0.08,'square',0.06);
    }
    player.jumpHeld = jumpPressed;
    player.coyote = player.onGround ? COYOTE : Math.max(0, player.coyote-dt);

    player.vy = Math.min(player.vy + GRAVITY*dt, MAX_FALL);

    player.x += player.vx*dt;
    resolveX();
    player.y += player.vy*dt;
    resolveY();

    if(player.invuln<=0){
      for(const sp of spikes){ if(aabbOverlap(player,sp)){ hurt(); break; } }
      for(const en of enemies){
        if(!en.alive) continue;
        if(aabbOverlap(player,en)){
          if(en.type!=='spiky' && player.vy>0 && (player.y+player.h-en.y)<16){
            en.alive=false; player.vy=JUMP_VEL*0.55;
            beep(880,0.08,'square',0.07);
          } else { hurt(); }
          break;
        }
      }
    }

    for(const c of coins){
      if(!c.collected && dist(player.x+player.w/2,player.y+player.h/2,c.x,c.y)<22){
        c.collected=true; coinsCollected++;
        beep(1000,0.06,'sine',0.05);
      }
    }
    for(const cp of checkpoints){
      if(!cp.activated && Math.abs(player.x-cp.x)<30){
        cp.activated=true; respawnPoint = {x:cp.x, y:cp.y-player.h};
        beep(700,0.1,'sine',0.06); beep(900,0.1,'sine',0.06,0.08);
      }
    }
    if(Math.abs((player.x+player.w/2)-goal.x)<26) win();

    for(const en of enemies){
      if(!en.alive) continue;
      en.x += en.dir*en.speed*dt;
      if(en.x<en.minX){ en.x=en.minX; en.dir=1; }
      if(en.x>en.maxX){ en.x=en.maxX; en.dir=-1; }
      if(en.type==='flyer'){ en.phase += dt; en.y = en.baseY + Math.sin(en.phase*en.freq)*en.amp; }
    }

    if(player.y > GROUND_Y+160) hurt();

    camX = clamp(player.x - W*0.4, 0, LEVEL_W-W);
  }

  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  let _skyGradient = null;
  function render(){
    if(!_skyGradient){
      _skyGradient = ctx.createLinearGradient(0,0,0,H);
      _skyGradient.addColorStop(0,'#2a1f4a'); _skyGradient.addColorStop(1,'#1a1030');
    }
    ctx.fillStyle=_skyGradient; ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.fillStyle='rgba(185,104,240,.16)';
    for(let i=0;i<9;i++){
      const hx = ((i*420 - camX*0.3) % (W+500)) - 250;
      ctx.beginPath(); ctx.ellipse(hx, GROUND_Y+60, 220,150,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-camX,0);

    for(const p of platforms){
      ctx.fillStyle = p.h>=100 ? '#3d2a5c' : '#5a3f85';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='rgba(185,104,240,.55)';
      ctx.fillRect(p.x,p.y,p.w,4);
    }

    ctx.fillStyle='#d8d8e0';
    for(const sp of spikes){
      const n = Math.round(sp.w/16);
      for(let i=0;i<n;i++){
        ctx.beginPath();
        ctx.moveTo(sp.x+i*16, sp.y+sp.h);
        ctx.lineTo(sp.x+i*16+8, sp.y);
        ctx.lineTo(sp.x+i*16+16, sp.y+sp.h);
        ctx.closePath(); ctx.fill();
      }
    }

    for(const cp of checkpoints){
      ctx.save();
      ctx.strokeStyle='#888'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(cp.x,cp.y); ctx.lineTo(cp.x,cp.y-70); ctx.stroke();
      ctx.fillStyle = cp.activated? '#5be38a':'#555';
      ctx.beginPath(); ctx.moveTo(cp.x,cp.y-70); ctx.lineTo(cp.x+28,cp.y-58); ctx.lineTo(cp.x,cp.y-46); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle='#eee'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(goal.x,goal.y); ctx.lineTo(goal.x,goal.y-140); ctx.stroke();
    ctx.fillStyle='#b968f0';
    ctx.beginPath(); ctx.moveTo(goal.x,goal.y-140); ctx.lineTo(goal.x+36,goal.y-122); ctx.lineTo(goal.x,goal.y-104); ctx.closePath(); ctx.fill();
    ctx.restore();

    for(const c of coins){
      if(c.collected) continue;
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.scale(Math.sin(gameTime*4+c.x)*0.4+1, 1);
      ctx.fillStyle='#ffd94a'; ctx.strokeStyle='#8a6a1a'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    for(const en of enemies){
      if(!en.alive) continue;
      ctx.save();
      ctx.translate(en.x+en.w/2, en.y+en.h/2);
      ctx.scale(en.dir<0?-1:1,1);
      if(en.type==='flyer'){
        ctx.fillStyle='rgba(111,214,255,.25)';
        ctx.beginPath(); ctx.ellipse(0,en.h*0.6,en.w*0.45,4,0,0,Math.PI*2); ctx.fill();
        const wing = Math.sin(en.phase*8)*0.5;
        ctx.fillStyle='#6fd6ff';
        ctx.save(); ctx.rotate(wing); ctx.beginPath(); ctx.ellipse(-en.w*0.3,0,en.w*0.4,en.h*0.22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.rotate(-wing); ctx.beginPath(); ctx.ellipse(en.w*0.3,0,en.w*0.4,en.h*0.22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.beginPath(); ctx.ellipse(0,0,en.w*0.4,en.h*0.42,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(en.w*0.14,-en.h*0.1,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(en.w*0.18,-en.h*0.1,1.4,0,Math.PI*2); ctx.fill();
      } else if(en.type==='spiky'){
        ctx.fillStyle='#2a2430';
        ctx.beginPath(); ctx.arc(0,0,en.w*0.42,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#ff3d6e'; ctx.lineWidth=2.5;
        for(let i=0;i<8;i++){
          const a = i*(Math.PI/4) + gameTime*1.5;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a)*en.w*0.4, Math.sin(a)*en.w*0.4);
          ctx.lineTo(Math.cos(a)*en.w*0.68, Math.sin(a)*en.w*0.68);
          ctx.stroke();
        }
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-3,2.4,0,Math.PI*2); ctx.arc(4,-3,2.4,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle='#ff5a5f';
        roundRectPath(-en.w/2,-en.h/2,en.w,en.h,6); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(en.w*0.18,-en.h*0.12,3.5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#111';
        ctx.beginPath(); ctx.arc(en.w*0.24,-en.h*0.12,1.6,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    if(player.invuln<=0 || Math.floor(gameTime*14)%2===0){
      ctx.save();
      ctx.translate(player.x+player.w/2, player.y+player.h/2);
      ctx.scale(player.facing<0?-1:1,1);
      ctx.fillStyle='rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(0,player.h/2+4,player.w*0.5,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#39e6c4';
      roundRectPath(-player.w/2,-player.h/2+6,player.w,player.h-6,6); ctx.fill();
      ctx.fillStyle='#ffd9b3';
      ctx.beginPath(); ctx.arc(0,-player.h/2,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#241f33';
      ctx.beginPath(); ctx.arc(4,-player.h/2-1,1.8,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    ctx.restore();

    if(runState==='countdown'){
      ctx.save();
      ctx.font='700 72px "Press Start 2P", monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.shadowColor='#b968f0'; ctx.shadowBlur=24;
      const label = countdown>1.1?'READY':'GO!';
      ctx.fillText(label, W/2, H/2);
      ctx.restore();
    }

    const mm=Math.floor(gameTime/60), ss=(gameTime%60).toFixed(1);
    let heartStr=''; for(let i=0;i<3;i++) heartStr += (i<lives? '❤️':'🖤');
    setHud(
      '<span>LIVES</span><span class="v">'+heartStr+'</span><span>LVL</span><span class="v">'+(levelIndex+1)+'/'+LEVELS.length+'</span>',
      '<span>COINS</span><span class="v">'+coinsCollected+'/'+totalCoins+'</span><span>TIME</span><span class="v">'+mm+':'+(ss.length<3?'0'+ss:ss)+'</span>'
    );
  }

  return { reset, update, render };
})();

/* =========================================================================
   STACK TOWER
   ========================================================================= */
const Stack = (function(){
  const CENTER_X = W/2, BASE_Y = 430;
  const ISO_X = 0.87, ISO_Y = 0.5;
  const BLOCK_H = 34;
  const BASE_W = 150;
  const MIN_OVERLAP = 6;
  const PERFECT_TOL = 4;
  const MIN_SURVIVABLE = 8;
  const RANGE = 170;

  let stack = [], fallingPieces = [], moving = null;
  let score = 0, best = 0, runState = 'playing', perfectFlash = 0, speedMult = 1;

  function hueAt(i){ return (140 + i*7) % 360; }

  function spawnMoving(){
    const top = stack[stack.length-1];
    const axis = top.axis==='x' ? 'y' : 'x'; // alternate axis every layer, like the real thing
    const z = top.z + BLOCK_H;
    const sign = Math.random()<0.5 ? -1 : 1;
    moving = {
      z, wx: top.wx, wy: top.wy, axis, dir: sign,
      speed: 90 * speedMult,
      cx: top.cx + (axis==='x' ? sign*RANGE : 0),
      cy: top.cy + (axis==='y' ? sign*RANGE : 0)
    };
  }

  function reset(){
    stack = [{ cx:0, cy:0, z:0, wx:BASE_W, wy:BASE_W, hue:hueAt(0), axis:'x' }];
    fallingPieces = [];
    score = 0;
    runState = 'playing';
    perfectFlash = 0;
    speedMult = 1;
    spawnMoving();
  }

  function makeFallingPiece(cx, cy, z, wx, wy, hue, dirSign, axis){
    const kick = 70, sign = dirSign==='pos' ? 1 : -1;
    return {
      cx, cy, z, wx, wy, hue,
      vx: axis==='x' ? sign*kick : 0,
      vy: axis==='y' ? sign*kick : 0,
      vz: 10, az: -480,
      rot: 0, vrot: sign*2.6,
      life: 1.4
    };
  }

  function endGame(){
    runState = 'over';
    best = Math.max(best, score);
    submitResult('stack', 'loss', score, {});
    setTimeout(()=> showBigMessage('TOWER DOWN', 'You stacked '+score+' block'+(score===1?'':'s')+'.', '#9dff57', 'TRY AGAIN', ()=>{ hideBigMessage(); reset(); }), 250);
  }

  function drop(){
    if(runState!=='playing' || !moving) return;
    const top = stack[stack.length-1];
    const axis = moving.axis;
    const mC = axis==='x' ? moving.cx : moving.cy, mW = axis==='x' ? moving.wx : moving.wy;
    const tC = axis==='x' ? top.cx : top.cy, tW = axis==='x' ? top.wx : top.wy;
    const mMin = mC-mW/2, mMax = mC+mW/2, tMin = tC-tW/2, tMax = tC+tW/2;
    let newMin = Math.max(mMin,tMin), newMax = Math.min(mMax,tMax);
    const overlap0 = newMax-newMin;

    if(overlap0 < MIN_OVERLAP){
      fallingPieces.push(makeFallingPiece(moving.cx, moving.cy, moving.z, moving.wx, moving.wy, hueAt(stack.length), moving.dir>0?'pos':'neg', axis));
      moving = null;
      beep(140,0.3,'sawtooth',0.08);
      endGame();
      return;
    }

    const perfect = overlap0 >= mW - PERFECT_TOL;
    let overlap = overlap0;
    if(perfect){ newMin = tMin; newMax = tMax; overlap = tMax-tMin; }
    const newC = (newMin+newMax)/2;
    const hue = hueAt(stack.length);
    const placed = axis==='x'
      ? { cx:newC, cy:moving.cy, z:moving.z, wx:overlap, wy:moving.wy, hue, axis }
      : { cx:moving.cx, cy:newC, z:moving.z, wx:moving.wx, wy:overlap, hue, axis };

    if(!perfect){
      if(mMin < newMin){
        const w = newMin-mMin, c = (mMin+newMin)/2;
        fallingPieces.push(axis==='x'
          ? makeFallingPiece(c, moving.cy, moving.z, w, moving.wy, hue, 'neg', axis)
          : makeFallingPiece(moving.cx, c, moving.z, moving.wx, w, hue, 'neg', axis));
      }
      if(mMax > newMax){
        const w = mMax-newMax, c = (newMax+mMax)/2;
        fallingPieces.push(axis==='x'
          ? makeFallingPiece(c, moving.cy, moving.z, w, moving.wy, hue, 'pos', axis)
          : makeFallingPiece(moving.cx, c, moving.z, moving.wx, w, hue, 'pos', axis));
      }
    } else {
      perfectFlash = 0.8;
      beep(1200,0.09,'sine',0.08,0.03);
    }

    stack.push(placed);
    score++;
    speedMult *= 1.03;

    if(placed.wx < MIN_SURVIVABLE || placed.wy < MIN_SURVIVABLE){
      moving = null;
      beep(300,0.15,'sawtooth',0.07);
      endGame();
      return;
    }

    beep(480+Math.min(score*3,260), 0.05, 'square', 0.06);
    spawnMoving();
  }

  function onDown(){ drop(); }
  window.addEventListener('keydown', e=>{
    if(e.key===' '||e.key==='Spacebar'){
      if(state==='stack') e.preventDefault();
      if(state==='stack') drop();
    }
  });

  function update(dt){
    if(runState==='playing' && moving){
      const top = stack[stack.length-1];
      if(moving.axis==='x'){
        moving.cx += moving.dir*moving.speed*dt;
        if(moving.cx > top.cx+RANGE){ moving.cx = top.cx+RANGE; moving.dir=-1; }
        if(moving.cx < top.cx-RANGE){ moving.cx = top.cx-RANGE; moving.dir=1; }
      } else {
        moving.cy += moving.dir*moving.speed*dt;
        if(moving.cy > top.cy+RANGE){ moving.cy = top.cy+RANGE; moving.dir=-1; }
        if(moving.cy < top.cy-RANGE){ moving.cy = top.cy-RANGE; moving.dir=1; }
      }
    }
    for(const f of fallingPieces){
      f.vz += f.az*dt;
      f.cx += f.vx*dt; f.cy += f.vy*dt; f.z += f.vz*dt;
      f.rot += f.vrot*dt;
      f.life -= dt;
    }
    fallingPieces = fallingPieces.filter(f=>f.life>0);
    if(perfectFlash>0) perfectFlash -= dt;
  }

  let _bgGradient = null;
  function stackBg(){
    if(!_bgGradient){
      _bgGradient = ctx.createLinearGradient(0,0,0,H);
      _bgGradient.addColorStop(0,'#1a1430'); _bgGradient.addColorStop(1,'#0d0a1a');
    }
    return _bgGradient;
  }

  function render(){
    ctx.fillStyle = stackBg(); ctx.fillRect(0,0,W,H);

    const topZ = stack.length ? stack[stack.length-1].z : 0;
    function project(x,y,z){
      return { sx: CENTER_X + (x-y)*ISO_X, sy: BASE_Y - (x+y)*ISO_Y - z + topZ };
    }
    function poly(pts, fill){
      ctx.beginPath();
      ctx.moveTo(pts[0].sx, pts[0].sy);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].sx, pts[i].sy);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }
    function drawBlock(cx,cy,z,wx,wy,hue){
      const hx=wx/2, hy=wy/2;
      poly([project(cx-hx,cy-hy,z), project(cx-hx,cy+hy,z), project(cx-hx,cy+hy,z+BLOCK_H), project(cx-hx,cy-hy,z+BLOCK_H)], `hsl(${hue},62%,30%)`);
      poly([project(cx-hx,cy-hy,z), project(cx+hx,cy-hy,z), project(cx+hx,cy-hy,z+BLOCK_H), project(cx-hx,cy-hy,z+BLOCK_H)], `hsl(${hue},62%,42%)`);
      poly([project(cx-hx,cy-hy,z+BLOCK_H), project(cx+hx,cy-hy,z+BLOCK_H), project(cx+hx,cy+hy,z+BLOCK_H), project(cx-hx,cy+hy,z+BLOCK_H)], `hsl(${hue},68%,56%)`);
    }

    const visible = stack.length > 22 ? stack.slice(stack.length-22) : stack;
    for(const b of visible) drawBlock(b.cx,b.cy,b.z,b.wx,b.wy,b.hue);
    if(runState==='playing' && moving) drawBlock(moving.cx,moving.cy,moving.z,moving.wx,moving.wy,hueAt(stack.length));

    for(const f of fallingPieces){
      const p = project(f.cx, f.cy, f.z);
      ctx.save();
      ctx.globalAlpha = clamp(f.life/1.4, 0, 1);
      ctx.translate(p.sx, p.sy);
      ctx.rotate(f.rot);
      const w = Math.max(8, (f.wx+f.wy)*ISO_X*0.45);
      ctx.fillStyle = `hsl(${f.hue},65%,45%)`;
      ctx.fillRect(-w/2,-w/2,w,w);
      ctx.restore();
    }

    ctx.save();
    ctx.textAlign='center';
    ctx.font='700 46px "Press Start 2P", monospace';
    ctx.fillStyle='#fff'; ctx.shadowColor='#9dff57'; ctx.shadowBlur=18;
    ctx.fillText(String(score), W/2, 90);
    ctx.restore();

    if(perfectFlash>0){
      ctx.save();
      ctx.globalAlpha = clamp(perfectFlash/0.8,0,1);
      ctx.textAlign='center';
      ctx.font='700 18px "Press Start 2P", monospace';
      ctx.fillStyle='#9dff57';
      ctx.fillText('PERFECT!', W/2, 128);
      ctx.restore();
    }

    setHud(
      '<span>SCORE</span><span class="v">'+score+'</span>',
      '<span>BEST</span><span class="v">'+best+'</span>'
    );
  }

  return { reset, update, render, onDown };
})();

/* =========================================================================
   BREAKOUT
   ========================================================================= */
const Breakout = (function(){
  const PADDLE_Y = H-36, PADDLE_H = 14, PADDLE_W = 110, PADDLE_WIDE_MULT = 1.6;
  const BALL_R = 8, MAX_BALLS = 6;
  const ROWS = 5, COLS = 12;
  const BRICK_W = 72, BRICK_H = 22, BRICK_GAP = 4, BRICK_TOP = 60;
  const BRICK_LEFT = (W - COLS*(BRICK_W+BRICK_GAP)+BRICK_GAP)/2;
  const BASE_SPEED = 320;
  const POWERUP_DROP_CHANCE = 0.22, POWERUP_FALL_SPEED = 130, POWERUP_DURATION = 9;
  const POWERUP_INFO = {
    wide:  { color:'#3dffb8', label:'W',  hud:'WIDE' },
    slow:  { color:'#8fd3ff', label:'S',  hud:'SLOW' },
    multi: { color:'#ffd93d', label:'M',  hud:'MULTI' },
    life:  { color:'#ff6fae', label:'+1', hud:null }
  };
  const POWERUP_TYPES = Object.keys(POWERUP_INFO);

  let paddleX, balls, bricks, drops, score, lives, level, launched, ended;
  let wideTimer, slowTimer;

  function hueAt(row){ return (205 + row*26) % 360; } // blue through violet, distinct from the field's own accent
  function paddleHalfW(){ return (wideTimer>0 ? PADDLE_W*PADDLE_WIDE_MULT : PADDLE_W)/2; }
  function ballSpeedFactor(){ return slowTimer>0 ? 0.6 : 1; }

  function buildBricks(){
    bricks = [];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        bricks.push({ x: BRICK_LEFT + c*(BRICK_W+BRICK_GAP), y: BRICK_TOP + r*(BRICK_H+BRICK_GAP), w:BRICK_W, h:BRICK_H, hue:hueAt(r), alive:true });
      }
    }
  }

  function stickBall(){ balls = [{ x:paddleX, y:PADDLE_Y-BALL_R-2, vx:0, vy:0 }]; launched = false; }

  function reset(){
    paddleX = W/2; score=0; lives=3; level=1; ended=false;
    drops = []; wideTimer=0; slowTimer=0;
    buildBricks(); stickBall();
  }

  function launch(){
    if(launched || ended) return;
    const speed = BASE_SPEED + (level-1)*22;
    const deg = -90 + (Math.random()*60-30);
    const rad = deg*Math.PI/180;
    balls[0].vx = Math.cos(rad)*speed; balls[0].vy = Math.sin(rad)*speed;
    launched = true;
    beep(300,0.08,'triangle',0.07);
  }

  function applyPowerup(type){
    if(type==='wide'){ wideTimer = POWERUP_DURATION; beep(520,0.12,'triangle',0.08); }
    else if(type==='slow'){ slowTimer = POWERUP_DURATION; beep(260,0.14,'sine',0.08); }
    else if(type==='life'){ lives = Math.min(5, lives+1); beep(900,0.12,'sine',0.09); }
    else if(type==='multi'){
      const extra = [];
      for(const b of balls){
        if(balls.length+extra.length >= MAX_BALLS) break;
        for(const off of [18,-18]){
          if(balls.length+extra.length >= MAX_BALLS) break;
          const speed = Math.hypot(b.vx,b.vy) || BASE_SPEED;
          const ang = Math.atan2(b.vy,b.vx) + off*Math.PI/180;
          extra.push({ x:b.x, y:b.y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed });
        }
      }
      balls = balls.concat(extra);
      beep(700,0.1,'square',0.08); beep(1000,0.1,'square',0.07,0.05);
    }
  }

  function endGame(){
    ended = true;
    beep(140,0.3,'sawtooth',0.08);
    submitResult('breakout', 'loss', score, { level });
    setTimeout(()=> showBigMessage('GAME OVER', 'Final score '+score+' · level '+level+'.', '#3d8bff', 'PLAY AGAIN', ()=>{ hideBigMessage(); reset(); }), 250);
  }

  function update(dt){
    if(ended) return;
    if(wideTimer>0) wideTimer -= dt;
    if(slowTimer>0) slowTimer -= dt;

    if(!launched){ balls[0].x = paddleX; return; }
    const halfW = paddleHalfW(), speedFactor = ballSpeedFactor();

    for(const ball of balls){
      ball.x += ball.vx*dt*speedFactor; ball.y += ball.vy*dt*speedFactor;
      if(ball.x < BALL_R){ ball.x=BALL_R; ball.vx=Math.abs(ball.vx); beep(200,0.04,'square',0.04); }
      if(ball.x > W-BALL_R){ ball.x=W-BALL_R; ball.vx=-Math.abs(ball.vx); beep(200,0.04,'square',0.04); }
      if(ball.y < BALL_R){ ball.y=BALL_R; ball.vy=Math.abs(ball.vy); beep(200,0.04,'square',0.04); }

      if(ball.vy>0 && ball.y+BALL_R>=PADDLE_Y && ball.y+BALL_R<=PADDLE_Y+PADDLE_H+12
         && ball.x>paddleX-halfW-BALL_R && ball.x<paddleX+halfW+BALL_R){
        const rel = clamp((ball.x-paddleX)/halfW, -1, 1);
        const speed = Math.hypot(ball.vx,ball.vy);
        const rad = (-90 + rel*62)*Math.PI/180;
        ball.vx = Math.cos(rad)*speed; ball.vy = Math.sin(rad)*speed;
        ball.y = PADDLE_Y-BALL_R-1;
        beep(420,0.06,'square',0.06);
      }

      for(const b of bricks){
        if(!b.alive) continue;
        if(ball.x+BALL_R>b.x && ball.x-BALL_R<b.x+b.w && ball.y+BALL_R>b.y && ball.y-BALL_R<b.y+b.h){
          b.alive=false; score += 10;
          const overlapX = Math.min(ball.x+BALL_R-b.x, b.x+b.w-(ball.x-BALL_R));
          const overlapY = Math.min(ball.y+BALL_R-b.y, b.y+b.h-(ball.y-BALL_R));
          if(overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
          beep(700+Math.random()*200,0.05,'sine',0.06);
          if(Math.random() < POWERUP_DROP_CHANCE){
            const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
            drops.push({ x:b.x+b.w/2, y:b.y+b.h/2, vy:POWERUP_FALL_SPEED, type });
          }
          break;
        }
      }
    }

    for(const d of drops) d.y += d.vy*dt;
    drops = drops.filter(d=>{
      if(d.y > PADDLE_Y-6 && d.y < PADDLE_Y+PADDLE_H && d.x > paddleX-halfW-10 && d.x < paddleX+halfW+10){
        applyPowerup(d.type);
        return false;
      }
      return d.y < H+20;
    });

    balls = balls.filter(b => b.y <= H+40);
    if(balls.length===0){
      lives--;
      if(lives<=0){ endGame(); return; }
      beep(180,0.2,'sawtooth',0.07);
      wideTimer=0; slowTimer=0; drops=[];
      stickBall();
      return;
    }

    if(bricks.every(b=>!b.alive)){
      level++; score += 50;
      beep(1200,0.12,'sine',0.08);
      wideTimer=0; slowTimer=0; drops=[];
      buildBricks(); stickBall();
    }
  }

  function onMove(p){ paddleX = clamp(p.x, paddleHalfW(), W-paddleHalfW()); }
  function onDown(){ launch(); }

  function render(){
    ctx.fillStyle = '#0b1526'; ctx.fillRect(0,0,W,H);
    for(const b of bricks){
      if(!b.alive) continue;
      ctx.fillStyle = `hsl(${b.hue},70%,55%)`; ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
    }

    for(const d of drops){
      const info = POWERUP_INFO[d.type];
      ctx.save();
      ctx.shadowColor=info.color; ctx.shadowBlur=10; ctx.fillStyle=info.color;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(d.x-16,d.y-10,32,20,6) : ctx.rect(d.x-16,d.y-10,32,20);
      ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#0b1526';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='700 11px "Press Start 2P", monospace';
      ctx.fillText(info.label, d.x, d.y+1);
      ctx.restore();
    }

    const halfW = paddleHalfW();
    ctx.save();
    ctx.shadowColor= wideTimer>0 ? '#3dffb8' : '#3d8bff'; ctx.shadowBlur=14; ctx.fillStyle = wideTimer>0 ? '#3dffb8' : '#3d8bff';
    ctx.fillRect(paddleX-halfW, PADDLE_Y, halfW*2, PADDLE_H);
    ctx.restore();

    for(const ball of balls){
      ctx.save();
      ctx.shadowColor = slowTimer>0 ? '#8fd3ff' : '#fff'; ctx.shadowBlur=10; ctx.fillStyle = slowTimer>0 ? '#8fd3ff' : '#fff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    if(!launched && !ended){
      ctx.save(); ctx.textAlign='center'; ctx.font='11px "Press Start 2P", monospace'; ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.fillText('CLICK TO LAUNCH', W/2, PADDLE_Y-28);
      ctx.restore();
    }

    let lifeStr=''; for(let i=0;i<5;i++) lifeStr += i<lives ? '🔵' : (i<3 ? '⬛' : '');
    let effects = '';
    if(wideTimer>0) effects += '<span>WIDE</span><span class="v">'+Math.ceil(wideTimer)+'s</span>';
    if(slowTimer>0) effects += '<span>SLOW</span><span class="v">'+Math.ceil(slowTimer)+'s</span>';
    setHud(
      '<span>SCORE</span><span class="v">'+score+'</span><span>LEVEL</span><span class="v">'+level+'</span>'+effects,
      '<span>LIVES</span><span class="v">'+lifeStr+'</span>'
    );
  }

  return { reset, update, render, onDown, onMove };
})();

/* =========================================================================
   SNAKE
   ========================================================================= */
const Snake = (function(){
  const CELL = 24, COLS = Math.floor(W/CELL), ROWS = Math.floor(H/CELL);
  let snake, dir, nextDir, food, moveTimer, moveInterval, score, ended;

  function randCell(){ return { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
  function placeFood(){
    let f;
    do { f = randCell(); } while(snake.some(s=>s.x===f.x && s.y===f.y));
    food = f;
  }

  function reset(){
    const my = Math.floor(ROWS/2), mx = Math.floor(COLS/2);
    snake = [ {x:mx,y:my}, {x:mx-1,y:my}, {x:mx-2,y:my} ];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    moveTimer = 0; moveInterval = 0.13;
    score = 0; ended = false;
    placeFood();
  }

  const KEY_DIRS = {
    ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, ArrowDown:{x:0,y:1}, s:{x:0,y:1},
    ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, ArrowRight:{x:1,y:0}, d:{x:1,y:0}
  };
  window.addEventListener('keydown', e=>{
    if(state!=='snake') return;
    const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
    const nd = KEY_DIRS[k];
    if(!nd) return;
    if(e.key.indexOf('Arrow')===0) e.preventDefault();
    if(nd.x===-dir.x && nd.y===-dir.y) return; // no instant reverse into yourself
    nextDir = nd;
  });

  function endGame(){
    ended = true;
    beep(140,0.3,'sawtooth',0.08);
    submitResult('snake', 'loss', score, { length: snake.length });
    setTimeout(()=> showBigMessage('GAME OVER', 'Final score '+score+' · length '+snake.length+'.', '#c6e83d', 'PLAY AGAIN', ()=>{ hideBigMessage(); reset(); }), 250);
  }

  function update(dt){
    if(ended) return;
    moveTimer += dt;
    if(moveTimer < moveInterval) return;
    moveTimer = 0;
    dir = nextDir;
    const head = snake[0];
    const nh = { x: head.x+dir.x, y: head.y+dir.y };
    if(nh.x<0 || nh.x>=COLS || nh.y<0 || nh.y>=ROWS || snake.some(s=>s.x===nh.x && s.y===nh.y)){
      endGame();
      return;
    }
    snake.unshift(nh);
    if(nh.x===food.x && nh.y===food.y){
      score += 10;
      moveInterval = Math.max(0.055, moveInterval*0.97);
      beep(900,0.06,'sine',0.07);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function render(){
    ctx.fillStyle = '#10190c'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.03)';
    for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
    for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

    ctx.save();
    ctx.shadowColor='#ffe24a'; ctx.shadowBlur=12; ctx.fillStyle='#ffe24a';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    snake.forEach((s,i)=>{
      const t = i/Math.max(1,snake.length-1);
      ctx.fillStyle = i===0 ? '#e8ff8a' : `hsl(${72-t*20},70%,${50-t*14}%)`;
      ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    });

    setHud(
      '<span>SCORE</span><span class="v">'+score+'</span>',
      '<span>LENGTH</span><span class="v">'+snake.length+'</span>'
    );
  }

  return { reset, update, render };
})();

/* =========================================================================
   SPACE INVADERS
   ========================================================================= */
const Invaders = (function(){
  const SHIP_Y = H-50, SHIP_W = 46, SHIP_H = 20;
  const INV_W = 34, INV_H = 24, INV_GAP_X = 14, INV_GAP_Y = 16;
  const ROW_COLORS = ['#ff5a3c','#ff7a3c','#ff9a4a','#ff3c6e','#ff3cae'];
  const POWERUP_DROP_CHANCE = 0.18, POWERUP_FALL_SPEED = 110, POWERUP_DURATION = 9;
  const POWERUP_INFO = {
    rapid:  { color:'#ffd93d', label:'R',  hud:'RAPID' },
    spread: { color:'#3dffb8', label:'S',  hud:'SPREAD' },
    shield: { color:'#8fe3ff', label:'SH', hud:null },
    life:   { color:'#ff6fae', label:'+1', hud:null }
  };
  const POWERUP_TYPES = Object.keys(POWERUP_INFO);

  let shipX, bullets, invBullets, invaders, invDir, invSpeed, drops;
  let score, lives, wave, ended, shootCooldown, stars;
  let rapidTimer, spreadTimer, shielded;

  const keys = {};
  function normKey(k){ return k.length===1 ? k.toLowerCase() : k; }
  window.addEventListener('keydown', e=>{
    if(state==='invaders' && ['ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key)) e.preventDefault();
    keys[normKey(e.key)] = true;
    if(state!=='invaders' || ended) return;
    if(e.key===' '||e.key==='Spacebar') shoot();
  });
  window.addEventListener('keyup', e=>{ keys[normKey(e.key)] = false; });

  if(!stars){
    stars = [];
    for(let i=0;i<70;i++) stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.4, a:Math.random()*0.5+0.2 });
  }

  function buildWave(){
    invaders = [];
    const cols = Math.min(6+wave, 10), rows = Math.min(3+Math.floor(wave/2), 5);
    const totalW = cols*(INV_W+INV_GAP_X)-INV_GAP_X;
    const left = (W-totalW)/2;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        invaders.push({ x:left+c*(INV_W+INV_GAP_X), y:56+r*(INV_H+INV_GAP_Y), color:ROW_COLORS[r%ROW_COLORS.length], alive:true });
      }
    }
    invDir = 1;
    invSpeed = 40 + wave*6;
  }

  function reset(){
    shipX = W/2; bullets=[]; invBullets=[]; drops=[]; score=0; lives=3; wave=1; ended=false; shootCooldown=0;
    rapidTimer=0; spreadTimer=0; shielded=false;
    buildWave();
  }

  function shoot(){
    if(shootCooldown>0 || ended) return;
    if(spreadTimer>0){
      bullets.push({x:shipX, y:SHIP_Y-SHIP_H/2, vx:0, vy:-520});
      bullets.push({x:shipX, y:SHIP_Y-SHIP_H/2, vx:-170, vy:-490});
      bullets.push({x:shipX, y:SHIP_Y-SHIP_H/2, vx:170, vy:-490});
    } else {
      bullets.push({x:shipX, y:SHIP_Y-SHIP_H/2, vx:0, vy:-520});
    }
    shootCooldown = rapidTimer>0 ? 0.12 : 0.32;
    beep(760,0.05,'square',0.06);
  }

  function aliveInvaders(){ return invaders.filter(v=>v.alive); }

  function applyPowerup(type){
    if(type==='rapid'){ rapidTimer = POWERUP_DURATION; beep(900,0.08,'square',0.08); }
    else if(type==='spread'){ spreadTimer = POWERUP_DURATION; beep(650,0.1,'triangle',0.08); }
    else if(type==='shield'){ shielded = true; beep(500,0.14,'sine',0.08); }
    else if(type==='life'){ lives = Math.min(5, lives+1); beep(900,0.12,'sine',0.09); }
  }

  function loseLife(){
    if(shielded){
      shielded = false;
      beep(380,0.18,'sawtooth',0.07);
      return;
    }
    lives--;
    beep(220,0.15,'sawtooth',0.07);
    if(lives<=0) endGame('GAME OVER', 'Final score '+score+' · wave '+wave+'.');
  }

  function endGame(title, sub){
    ended = true;
    beep(140,0.3,'sawtooth',0.08);
    submitResult('invaders', 'loss', score, { wave });
    setTimeout(()=> showBigMessage(title, sub, '#ff5a3c', 'PLAY AGAIN', ()=>{ hideBigMessage(); reset(); }), 250);
  }

  function update(dt){
    if(ended) return;
    if(shootCooldown>0) shootCooldown -= dt;
    if(rapidTimer>0) rapidTimer -= dt;
    if(spreadTimer>0) spreadTimer -= dt;
    if(keys['arrowleft']||keys['a']) shipX -= 260*dt;
    if(keys['arrowright']||keys['d']) shipX += 260*dt;
    shipX = clamp(shipX, SHIP_W/2, W-SHIP_W/2);

    const alive = aliveInvaders();
    if(alive.length){
      let minX=Infinity, maxX=-Infinity, maxY=-Infinity;
      for(const v of alive){ minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x+INV_W); maxY=Math.max(maxY,v.y+INV_H); }
      const dx = invDir*invSpeed*dt;
      if((maxX+dx>W-10 && invDir>0) || (minX+dx<10 && invDir<0)){
        invDir *= -1;
        for(const v of invaders) v.y += 18;
        invSpeed *= 1.04;
      } else {
        for(const v of invaders) v.x += dx;
      }
      if(maxY >= SHIP_Y-30){ endGame('OVERRUN', 'The invaders reached you. Final score '+score+'.'); return; }
      if(Math.random() < (0.5+wave*0.1)*dt){
        const shooter = alive[Math.floor(Math.random()*alive.length)];
        invBullets.push({x:shooter.x+INV_W/2, y:shooter.y+INV_H, vy:220+wave*8});
      }
    } else {
      wave++; score += 100;
      beep(1200,0.12,'sine',0.08);
      buildWave();
    }

    for(const b of bullets){ b.x += b.vx*dt; b.y += b.vy*dt; }
    for(const b of invBullets) b.y += b.vy*dt;

    for(const b of bullets){
      if(b.y < -900) continue;
      for(const v of invaders){
        if(!v.alive) continue;
        if(b.x>v.x && b.x<v.x+INV_W && b.y>v.y && b.y<v.y+INV_H){
          v.alive=false; b.y=-999; score += 20;
          beep(500+Math.random()*300,0.05,'sine',0.06);
          if(Math.random() < POWERUP_DROP_CHANCE){
            const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
            drops.push({ x:v.x+INV_W/2, y:v.y+INV_H/2, vy:POWERUP_FALL_SPEED, type });
          }
          break;
        }
      }
    }
    for(const b of invBullets){
      if(b.y > H+900) continue;
      if(b.x>shipX-SHIP_W/2 && b.x<shipX+SHIP_W/2 && b.y>SHIP_Y-SHIP_H/2 && b.y<SHIP_Y+SHIP_H/2){
        b.y = H+999;
        loseLife();
      }
    }
    bullets = bullets.filter(b=> b.y > -900 && b.y < H+10);
    invBullets = invBullets.filter(b=> b.y < H+900 && b.y > -10);

    for(const d of drops) d.y += d.vy*dt;
    drops = drops.filter(d=>{
      if(d.x>shipX-SHIP_W/2-10 && d.x<shipX+SHIP_W/2+10 && d.y>SHIP_Y-SHIP_H/2-10 && d.y<SHIP_Y+SHIP_H/2+10){
        applyPowerup(d.type);
        return false;
      }
      return d.y < H+20;
    });
  }

  function render(){
    ctx.fillStyle = '#120a14'; ctx.fillRect(0,0,W,H);
    for(const s of stars){ ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(s.x,s.y,s.r,s.r); }

    for(const v of invaders){
      if(!v.alive) continue;
      ctx.save(); ctx.shadowColor=v.color; ctx.shadowBlur=8; ctx.fillStyle=v.color;
      ctx.fillRect(v.x, v.y, INV_W, INV_H*0.6);
      ctx.fillRect(v.x+6, v.y+INV_H*0.55, INV_W-12, INV_H*0.45);
      ctx.restore();
    }

    for(const b of bullets){ ctx.fillStyle='#8fe3ff'; ctx.fillRect(b.x-2, b.y-8, 4, 14); }
    for(const b of invBullets){ ctx.fillStyle='#ff5a3c'; ctx.fillRect(b.x-2, b.y-7, 4, 12); }

    for(const d of drops){
      const info = POWERUP_INFO[d.type];
      ctx.save();
      ctx.shadowColor=info.color; ctx.shadowBlur=10; ctx.fillStyle=info.color;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(d.x-15,d.y-10,30,20,6) : ctx.rect(d.x-15,d.y-10,30,20);
      ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#120a14';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='700 10px "Press Start 2P", monospace';
      ctx.fillText(info.label, d.x, d.y+1);
      ctx.restore();
    }

    if(shielded){
      ctx.save();
      ctx.strokeStyle='#8fe3ff'; ctx.lineWidth=2; ctx.globalAlpha=0.7; ctx.shadowColor='#8fe3ff'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(shipX, SHIP_Y, SHIP_W*0.72, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor='#8fe3ff'; ctx.shadowBlur=12; ctx.fillStyle='#8fe3ff';
    ctx.beginPath();
    ctx.moveTo(shipX, SHIP_Y-SHIP_H/2);
    ctx.lineTo(shipX-SHIP_W/2, SHIP_Y+SHIP_H/2);
    ctx.lineTo(shipX+SHIP_W/2, SHIP_Y+SHIP_H/2);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    let lifeStr=''; for(let i=0;i<5;i++) lifeStr += i<lives ? '🚀' : (i<3 ? '⬛' : '');
    let effects = '';
    if(rapidTimer>0) effects += '<span>RAPID</span><span class="v">'+Math.ceil(rapidTimer)+'s</span>';
    if(spreadTimer>0) effects += '<span>SPREAD</span><span class="v">'+Math.ceil(spreadTimer)+'s</span>';
    setHud(
      '<span>SCORE</span><span class="v">'+score+'</span><span>WAVE</span><span class="v">'+wave+'</span>'+effects,
      '<span>LIVES</span><span class="v">'+lifeStr+'</span>'+(shielded?'<span>🛡️</span>':'')
    );
  }

  return { reset, update, render };
})();

/* =========================================================================
   WHACK-A-MOLE
   ========================================================================= */
const Whack = (function(){
  const COLS=4, ROWS=3, holeW=190, holeH=150;
  const originX = (W-COLS*holeW)/2, originY = (H-ROWS*holeH)/2+30;
  const ROUND_TIME = 30;

  let holes, score, misses, timeLeft, ended, started, spawnTimer, mouse;

  function layoutHoles(){
    holes = [];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        holes.push({ cx: originX+c*holeW+holeW/2, cy: originY+r*holeH+holeH/2, up:false, upTimer:0, hit:false, bonkTimer:0 });
      }
    }
  }

  function reset(){
    layoutHoles();
    score=0; misses=0; timeLeft=ROUND_TIME; ended=false; started=false; spawnTimer=0.5;
    mouse = { x:W/2, y:H/2 };
  }

  function popRandomMole(){
    const down = holes.filter(h=>!h.up);
    if(!down.length) return;
    const h = down[Math.floor(Math.random()*down.length)];
    h.up = true; h.hit = false;
    h.upTimer = Math.max(0.38, 0.85 - (ROUND_TIME-timeLeft)*0.012);
  }

  function endGame(){
    ended = true;
    beep(900,0.2,'sine',0.08);
    submitResult('whack', 'loss', score, { misses });
    setTimeout(()=> showBigMessage("TIME'S UP", 'Final score '+score+' · '+misses+' miss'+(misses===1?'':'es')+'.', '#e13dff', 'PLAY AGAIN', ()=>{ hideBigMessage(); reset(); }), 250);
  }

  function update(dt){
    if(ended || !started) return;
    timeLeft -= dt;
    if(timeLeft<=0){ timeLeft=0; endGame(); return; }
    spawnTimer -= dt;
    if(spawnTimer<=0){
      popRandomMole();
      spawnTimer = Math.max(0.32, 0.85 - (ROUND_TIME-timeLeft)*0.015);
    }
    for(const h of holes){
      if(h.up){
        h.upTimer -= dt;
        if(h.upTimer<=0){ h.up=false; if(!h.hit) misses++; }
      }
      if(h.bonkTimer>0) h.bonkTimer -= dt;
    }
  }

  function onMove(p){ mouse = p; }
  function onDown(p){
    if(ended) return;
    if(!started){ started = true; }
    for(const h of holes){
      if(h.up && !h.hit && dist(p.x,p.y,h.cx,h.cy-14) < 50){
        h.hit = true; h.up = false; h.bonkTimer = 0.22;
        score += 10;
        beep(1000,0.07,'square',0.07);
        return;
      }
    }
    beep(160,0.08,'sawtooth',0.04);
  }

  function render(){
    ctx.fillStyle = '#1a1024'; ctx.fillRect(0,0,W,H);
    for(const h of holes){
      ctx.beginPath(); ctx.ellipse(h.cx, h.cy+34, 72, 26, 0, 0, Math.PI*2);
      ctx.fillStyle = '#2c1a3a'; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth=4; ctx.stroke();

      if(h.up){
        ctx.save();
        if(h.bonkTimer>0) ctx.translate(0, -4);
        ctx.fillStyle = '#b5784a';
        ctx.beginPath(); ctx.ellipse(h.cx, h.cy, 42, 36, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8b98a';
        ctx.beginPath(); ctx.ellipse(h.cx-14, h.cy-6, 7, 9, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(h.cx+14, h.cy-6, 7, 9, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a1024';
        ctx.beginPath(); ctx.arc(h.cx-14, h.cy-6, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(h.cx+14, h.cy-6, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#6b3f22';
        ctx.beginPath(); ctx.ellipse(h.cx, h.cy+10, 10, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }

    ctx.save();
    ctx.strokeStyle = '#e13dff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 16, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y-24); ctx.lineTo(mouse.x, mouse.y-10);
    ctx.moveTo(mouse.x, mouse.y+10); ctx.lineTo(mouse.x, mouse.y+24);
    ctx.moveTo(mouse.x-24, mouse.y); ctx.lineTo(mouse.x-10, mouse.y);
    ctx.moveTo(mouse.x+10, mouse.y); ctx.lineTo(mouse.x+24, mouse.y);
    ctx.stroke();
    ctx.restore();

    if(!started && !ended){
      ctx.save(); ctx.textAlign='center'; ctx.font='13px "Press Start 2P", monospace'; ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.fillText('CLICK A HOLE TO START', W/2, originY-26);
      ctx.restore();
    }

    setHud(
      '<span>SCORE</span><span class="v">'+score+'</span><span>MISSES</span><span class="v">'+misses+'</span>',
      '<span>TIME</span><span class="v">'+Math.ceil(timeLeft)+'</span>'
    );
  }

  return { reset, update, render, onDown, onMove };
})();

/* =========================================================================
   wiring
   ========================================================================= */
function setState(s){
  state = s;
  hideBigMessage();
  if(s==='menu'){
    menuOverlay.classList.remove('hidden');
    hud.classList.add('hidden');
  } else {
    menuOverlay.classList.add('hidden');
    hud.classList.remove('hidden');
    if(s==='pool') Pool.reset();
    if(s==='duck') Duck.reset();
    if(s==='kart') Kart.reset();
    if(s==='platform') Platform.reset();
    if(s==='stack') Stack.reset();
    if(s==='breakout') Breakout.reset();
    if(s==='snake') Snake.reset();
    if(s==='invaders') Invaders.reset();
    if(s==='whack') Whack.reset();
  }
}

  });
});

});

});

function setBusy(btn, busy, label){ btn.disabled = busy; btn.textContent = busy ? 'PLEASE WAIT…' : label; }

siSubmit.addEventListener('click', async ()=>{
  siError.textContent = '';
  if(!sb){ siError.textContent = 'Not connected yet — add your Supabase keys to the game code first.'; return; }
  const email = siEmail.value.trim(), password = siPassword.value;
  if(!email || !password){ siError.textContent = 'Enter your email and password.'; return; }
  setBusy(siSubmit, true, 'SIGN IN');
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ siError.textContent = error.message; return; }
    closeModal(authModal);
    siEmail.value=''; siPassword.value='';
  } catch(e){
    siError.textContent = "Couldn't reach the server — try again in a moment.";
  } finally {
    setBusy(siSubmit, false, 'SIGN IN');
  }
});

suSubmit.addEventListener('click', async ()=>{
  suError.textContent = '';
  if(!sb){ suError.textContent = 'Not connected yet — add your Supabase keys to the game code first.'; return; }
  const username = suUsername.value.trim(), email = suEmail.value.trim(), password = suPassword.value;
  if(!username || !email || !password){ suError.textContent = 'Fill in a username, email, and password.'; return; }
  if(password.length < 6){ suError.textContent = 'Password needs to be at least 6 characters.'; return; }
  setBusy(suSubmit, true, 'CREATE ACCOUNT');
  try{
    const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
    if(existing){
      suError.textContent = 'That username is taken — try another.';
      return;
    }
    const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username } } });
    if(error){ suError.textContent = error.message; return; }
    if(data.session){
      closeModal(authModal);
      suUsername.value=''; suEmail.value=''; suPassword.value='';
    } else {
      suError.style.color = 'var(--pool)';
      suError.textContent = 'Check your email to confirm your account, then sign in.';
    }
  } catch(e){
    suError.textContent = "Couldn't reach the server — try again in a moment.";
  } finally {
    setBusy(suSubmit, false, 'CREATE ACCOUNT');
  }
});

signOutBtn.addEventListener('click', async ()=>{

  closeModal(accountModal);

historyBtn.addEventListener('click', ()=>{

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatScore(game, score){
  if(game==='kart' || game==='platform'){
    const m = Math.floor(score/60), s = (score%60).toFixed(1);
    return m+':'+(s.length<3?'0'+s:s);
  }
  return String(score);
}

async function loadHistory(){
  historyList.innerHTML = '<div class="list-empty">Loading…</div>';
  if(!sb || !currentUser) return;
  let data, error;
  try{
    ({ data, error } = await sb.from('game_results')
      .select('*').eq('user_id', currentUser.id)
      .order('created_at', { ascending:false }).limit(50));
  } catch(e){ error = e; }
  if(error || !data || data.length===0){
    historyList.innerHTML = '<div class="list-empty">'+(error ? "Couldn't load your history right now." : 'No games recorded yet — go play something!')+'</div>';
    return;
  }
  historyList.innerHTML = data.map(row=>{
    const when = new Date(row.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    const scoreStr = row.score==null ? '' : (' · ' + formatScore(row.game, row.score));
    return '<div class="hist-row">'
      + '<div><div class="hist-game">'+escapeHtml(GAME_LABELS[row.game]||row.game)+'</div>'
      + '<div class="hist-meta">'+escapeHtml(String(row.outcome).toUpperCase())+scoreStr+'</div></div>'
      + '<div class="hist-when">'+when+'</div></div>';
  }).join('');
}

function lbRow(i, username, scoreText){
  return '<div class="lb-row"><div class="lb-rank">#'+(i+1)+'</div><div class="lb-name">'+escapeHtml(username)+'</div><div class="lb-score">'+escapeHtml(scoreText)+'</div></div>';
}

// Kart and Pool race/play against a bot of a chosen difficulty, so their leaderboards
// split into Easy/Medium/Hard sub-boards. Duck Hunt and Sky Runner have no bot, so
// they stay as one board each and the difficulty row hides for them.
const GAMES_WITH_DIFFICULTY = ['kart','pool'];

async function loadLeaderboard(game, difficulty){
  leaderboardList.innerHTML = '<div class="list-empty">Loading…</div>';
  if(!sb){
    leaderboardList.innerHTML = '<div class="list-empty">Not connected yet — the game owner still needs to add their Supabase keys.</div>';
    return;
  }
  try{
    if(game==='pool'){
      const { data, error } = await sb.from('pool_leaderboard').select('*').eq('difficulty', difficulty).order('wins',{ascending:false}).limit(10);
      if(error || !data || data.length===0){ leaderboardList.innerHTML = '<div class="list-empty">No ranked pool games yet at this difficulty.</div>'; return; }
      leaderboardList.innerHTML = data.map((row,i)=> lbRow(i, row.username, row.wins+' win'+(row.wins===1?'':'s'))).join('');
      return;
    }
    const higherIsBetter = (game==='duck' || game==='stack' || game==='breakout' || game==='snake' || game==='invaders' || game==='whack');
    const table = game+'_leaderboard';
    const col = higherIsBetter ? 'best_score' : 'best_time';
    const asc = !higherIsBetter;
    let query = sb.from(table).select('*');
    if(game==='kart') query = query.eq('difficulty', difficulty);
    const { data, error } = await query.order(col,{ascending:asc}).limit(10);
    if(error || !data || data.length===0){
      leaderboardList.innerHTML = '<div class="list-empty">No scores yet'+(game==='kart'?' at this difficulty':'')+' — be the first!</div>';
      return;
    }
    leaderboardList.innerHTML = data.map((row,i)=> lbRow(i, row.username, formatScore(game, row[col]))).join('');
  } catch(e){
    leaderboardList.innerHTML = '<div class="list-empty">Couldn\'t load the leaderboard right now.</div>';
  }
}

function showLeaderboard(game, difficulty){
  leaderboardModal.querySelectorAll('.modal-tabs.main button').forEach(b=> b.classList.toggle('active', b.getAttribute('data-game')===game));
  if(GAMES_WITH_DIFFICULTY.includes(game)){
    lbDiffTabs.classList.remove('hidden');
    lbDiffTabs.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b.getAttribute('data-diff')===difficulty));
  } else {
    lbDiffTabs.classList.add('hidden');
  }
  loadLeaderboard(game, difficulty);
}

leaderboardBtn.addEventListener('click', ()=>{
  openModal(leaderboardModal);
  showLeaderboard('duck');
});
leaderboardModal.querySelectorAll('.modal-tabs.main button').forEach(btn=>{
  btn.addEventListener('click', ()=> showLeaderboard(btn.getAttribute('data-game'), 'medium'));

});

canvas.addEventListener('mousedown', e=>{
  const p = getPos(e);
  if(state==='pool') Pool.onDown(p);
  else if(state==='duck') Duck.onDown(p);
  else if(state==='kart') Kart.onDown(p);
  else if(state==='stack') Stack.onDown(p);
  else if(state==='breakout') Breakout.onDown(p);
  else if(state==='whack') Whack.onDown(p);
});
canvas.addEventListener('mousemove', e=>{
  const p = getPos(e);
  if(state==='pool') Pool.onMove(p);
  else if(state==='duck') Duck.onMove(p);
  else if(state==='breakout') Breakout.onMove(p);
  else if(state==='whack') Whack.onMove(p);
});
canvas.addEventListener('mouseup', e=>{
  const p = getPos(e);
  if(state==='pool') Pool.onUp(p);
});
canvas.addEventListener('mouseleave', e=>{
  if(state==='pool') Pool.onUp(getPos(e));
});
canvas.style.cursor = 'crosshair';

let last = 0;
function loop(t){
  if(!last) last=t;
  const dt = Math.min((t-last)/1000, 0.033);
  last = t;
  ctx.clearRect(0,0,W,H);
  if(state==='pool'){ Pool.update(dt); Pool.render(); }
  else if(state==='duck'){ Duck.update(dt); Duck.render(); }
  else if(state==='kart'){ Kart.update(dt); Kart.render(); }
  else if(state==='platform'){ Platform.update(dt); Platform.render(); }
  else if(state==='stack'){ Stack.update(dt); Stack.render(); }
  else if(state==='breakout'){ Breakout.update(dt); Breakout.render(); }
  else if(state==='snake'){ Snake.update(dt); Snake.render(); }
  else if(state==='invaders'){ Invaders.update(dt); Invaders.render(); }
  else if(state==='whack'){ Whack.update(dt); Whack.render(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
